<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrnGlobal — Surgical Procedure Management</title>
    <script>
      // GitHub Pages SPA fallback (https://github.com/rafgraph/spa-github-pages).
      // GH Pages serves this file for any unknown path. It re-encodes the real path
      // into a query string on the repo's base URL, then index.html's matching
      // script below decodes it and restores the URL via history.replaceState
      // before React Router mounts, so deep links (e.g. /ornglobal/procedures/abc)
      // load correctly instead of 404ing.
      var pathSegmentsToKeep = 1; // keeps "/ornglobal" from the pathname

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
